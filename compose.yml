# 新しいプロジェクトごとに name を変える。同じ名前だと、コンテナとNamed Volumeを共有してしまう。
name: CHANGE-ME

services:
  swift:
    build:
      context: .
      dockerfile: Dockerfile
    image: swift-claude-xtool:latest
    platform: linux/arm64
    working_dir: /workspace
    stdin_open: true
    tty: true

    volumes:
      # Source code (Macと共有)
      - .:/workspace

      # Swift Package Manager(Darwin SDKもここに入る)
      - swiftpm-cache:/root/.cache
      - swiftpm-config:/root/.swiftpm

      # Claude Code settings and authentication
      - claude-config:/root/.claude

      # xtool / Apple Developer settings
      - developer-config:/root/.config
      - developer-data:/root/.local/share

      # Apple Developer API Key
      # ファイル名にKey IDを入れないよう、private/secrets/ に固定の名前で置く(Gitの対象外)
      - ./private/secrets/apple-api-key.p8:/run/secrets/apple-api-key.p8:ro

    environment:
      CLAUDE_CONFIG_DIR: /root/.claude
      # Macで動かす scripts/usbmuxd-relay.mjs への接続先
      USBMUXD_SOCKET_ADDRESS: host.docker.internal:27015

    command: /bin/bash

# 既定では、プロジェクトごとに空のボリュームができる。
# Darwin SDKとxtoolの認証を別プロジェクトと共有する場合は、該当するボリュームに
# external と name を設定する(例: wifi-swift プロジェクトの SDK を共有する)。
# 共有すると、片方での変更がもう片方にも影響する。共有の動作は未検証。
volumes:
  swiftpm-cache:
  swiftpm-config:
    # external: true
    # name: wifi-swift_swiftpm-config
  claude-config:
  developer-config:
    # external: true
    # name: wifi-swift_developer-config
  developer-data:
    # external: true
    # name: wifi-swift_developer-data
